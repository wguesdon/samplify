[project]
name = "samplify"
version = "0.18.0"
description = "Find sample names that are the same sample spelled differently, and let a person confirm each group before anything is renamed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "William Guesdon" }]
keywords = ["bioinformatics", "metadata", "sample-names", "harmonization", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "openai>=2.21.0",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.1",
    "rich>=14.3.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/wguesdon/samplify"
Issues = "https://github.com/wguesdon/samplify/issues"

[project.scripts]
samplify = "samplify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/samplify"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "matplotlib>=3.8",
    "hypothesis>=6.165.10",
]

[tool.pytest.ini_options]
markers = [
    "live: requires a real OpenRouter API key (run with -m live)",
    "local: requires a running ollama server (run with -m local)",
]
# The default run is the offline suite. A -m on the command line replaces this.
addopts = "-m 'not live and not local'"
